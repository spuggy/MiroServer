apply plugin:'java'

sourceCompatibility = 1.6
targetCompatibility = 1.6

//webAppSourceDirectory="dist/webapps"


sourceSets {
    main {
        java {
            srcDir 'src'

        }
//        resources {
//            srcDir 'src/resources'
//        }
    }
    test {
        java {
            srcDir 'test'
        }
//        resources {
//            srcDir 'src/resources'
//        }
    }
}




repositories {
    mavenCentral()
    mavenLocal()
}


configurations {
    junitAnt
}
